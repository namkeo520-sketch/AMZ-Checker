
name: Amazon News Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  collect-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect Amazon news
        run: python amazon_news.py

      - name: Save news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amazon-news.md
          if ! git diff --cached --quiet; then
            git commit -m "Update Amazon news"
            git push
          fi

